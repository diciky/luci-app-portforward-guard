name: Build IPK Package

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up OpenWrt SDK
        run: |
          mkdir -p openwrt-sdk && cd openwrt-sdk
          # Try different SDK versions
          SDK_URLS=(
            "https://downloads.openwrt.org/releases/23.05.5/x86_64/openwrt-sdk-23.05.5-x86_64_gcc-12.3.0_musl.Linux-x86_64.tar.xz"
            "https://downloads.openwrt.org/releases/23.05.3/x86_64/openwrt-sdk-23.05.3-x86_64_gcc-12.3.0_musl.Linux-x86_64.tar.zst"
            "https://downloads.openwrt.org/snapshots/targets/x86/64/openwrt-sdk-x86-64_gcc-13.2.0_musl.Linux-x86_64.tar.xz"
          )
          for url in "${SDK_URLS[@]}"; do
            echo "Trying $url"
            if curl -sL "$url" -o sdk.tar.xz && [ -s sdk.tar.xz ]; then
              file sdk.tar.xz | grep -q "XZ compressed\|tar archive" && break
            fi
          done
          if [ ! -s sdk.tar.xz ] || ! file sdk.tar.xz | grep -q "XZ compressed\|tar archive"; then
            echo "Failed to download valid SDK"
            ls -la sdk.tar.xz 2>/dev/null || true
            head -c 100 sdk.tar.xz 2>/dev/null | xxd || true
            exit 1
          fi
          tar xJf sdk.tar.xz
          ls -la
          cd ..
          rm -rf openwrt-sdk 2>/dev/null || true
          ls -la openwrt-sdk-* 2>/dev/null || true
          if [ -d openwrt-sdk-* ]; then mv openwrt-sdk-*/* . 2>/dev/null || true; fi
          ls -la

      - name: Copy package files
        run: |
          cp -r root/* openwrt-sdk/package/luci-app-portforward-guard/

      - name: Update feeds
        run: |
          cd openwrt-sdk
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure package
        run: |
          cd openwrt-sdk
          make package/luci-app-portforward-guard/compile

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-portforward-guard-ipk
          path: openwrt-sdk/bin/packages/*/luci/luci-app-portforward-guard*.ipk
