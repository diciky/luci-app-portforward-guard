name: Build IPK Package

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up OpenWrt SDK
        run: |
          SDK_URL="https://downloads.openwrt.org/releases/23.05.5/targets/x86/64/openwrt-sdk-23.05.5-x86-64_gcc-12.3.0_musl.Linux-x86_64.tar.xz"
          echo "Downloading $SDK_URL"
          curl -sL "$SDK_URL" -o sdk.tar.xz
          if [ ! -s sdk.tar.xz ]; then
            echo "Download failed"
            exit 1
          fi
          file sdk.tar.xz
          tar xJf sdk.tar.xz
          ls -la
          # SDK extracts to openwrt-sdk-VERSION directory
          SDK_DIR=$(ls -d openwrt-sdk-* 2>/dev/null | head -1)
          echo "SDK directory: $SDK_DIR"
          # Move contents to sdk folder for easier access
          mkdir -p sdk
          mv $SDK_DIR/* sdk/
          mv $SDK_DIR/.* sdk/ 2>/dev/null || true
          ls -la sdk/

      - name: Copy package files
        run: |
          mkdir -p sdk/package/luci-app-portforward-guard
          cp -r root/* sdk/package/luci-app-portforward-guard/

      - name: Configure package
        env:
          TERMINFO: /usr/share/terminfo
        run: |
          cd sdk
          export FORCE=1
          make package/luci-app-portforward-guard/clean
          make package/luci-app-portforward-guard/compile

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-portforward-guard-ipk
          path: sdk/bin/packages/*/luci/luci-app-portforward-guard*.ipk
